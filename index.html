<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This is a favicon icon -->
    <link rel="shortcut icon" href="./assets/hero-circle.png" type="image/x-icon">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- External CSS -->
    <link rel="stylesheet" href="./style/style.css">

    <title>TechWave</title>
</head>
<body>
    <header>
        <!-- Navbar -->
        <nav class="width_max flex_display nav_container text_color">
            <h1 class="text_color">Tech<span class="highlight">Wave</span></h1> 
                <div class="menu_container text_color hide">
                    <ul class="flex_display">
                        <li><a class="text_color" href="#">About</a></li>
                        <li><a class="text_color" href="#">Episodes</a></li>
                        <li><a class="text_color" href="#">Host</a></li>
                    </ul>
                </div>
                <button class="btn_style hide">Subscribe <i class="fa-solid fa-arrow-right"></i></button>

            <div class="hamburger">
                <img src="./assets/hamburger-menu.png" alt="">
            </div>
        </nav>

        <!-- Hero Banner Section -->
        <section class="banner_bg">
            <div class="banner_container grid_display">

                <div class="image_box">
                    <img class="circle_image" src="./assets/hero-circle.png" alt="">
                    <span class="badge">NEW</span>
                    <img class="microphone_image" src="./assets/microphone.png" alt="">
                </div>

                <div class="text_box">
                    <h2 class="text_color">TechWave</h2>
                    <p class="text_color">Your daily dose of tech insights, productivity hacks, and personal growth</p>

                    <div class="btn_group flex_display">
                        <button class="btn_style"><img src="./assets/spotify.png" alt="">Listen on Spotify</button>

                        <button id="highlight_btn"><img src="./assets/message.png" alt="">Subscribe</button>
                    </div>
                </div>
            </div>
        </section>
    </header>
</body>
</html>
